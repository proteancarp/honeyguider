[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "pathf1ndar"
version = "0.1.0"
description = "Offline, terminal-native documentation and task navigator"
readme = "README.md"
requires-python = ">=3.11"
dependencies = ["typer>=0.12,<1", "rich>=13,<15", "httpx>=0.27,<1", "beautifulsoup4>=4.12,<5"]

[project.optional-dependencies]
dev = ["pytest>=8,<10"]

[project.scripts]
pathf1ndar = "pathf1ndar.cli:app"

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = ["src"]
